<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Local Docker Compose architecture</title>
  <desc id="desc">A diagram showing a browser and API client talking to Django, with Django connected to PostgreSQL, Temporal, and Mailpit. A Temporal worker connects to Temporal and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f6"/>
      <stop offset="1" stop-color="#e8f0ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16302b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#46766b"/>
    </marker>
    <style>
      .title { font: 700 31px Georgia, serif; fill: #16302b; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #52716a; }
      .label { font: 700 20px system-ui, sans-serif; fill: #16302b; }
      .small { font: 400 15px system-ui, sans-serif; fill: #52716a; }
      .box { fill: #ffffff; stroke: #b9d0c8; stroke-width: 2; }
      .accent { fill: #d9ece5; stroke: #6aa08f; stroke-width: 2; }
      .line { stroke: #46766b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #9a6a3a; stroke-width: 2.5; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">One local stack, several focused services</text>
  <text x="70" y="102" class="subtitle">Docker Compose gives each service a name and lets them communicate on one private network.</text>

  <rect x="70" y="180" width="250" height="120" rx="18" class="box" filter="url(#shadow)"/>
  <text x="195" y="225" text-anchor="middle" class="label">Browser / API client</text>
  <text x="195" y="255" text-anchor="middle" class="small">localhost:8000</text>
  <text x="195" y="279" text-anchor="middle" class="small">Swagger, curl, or UI</text>

  <rect x="440" y="160" width="320" height="160" rx="18" class="accent" filter="url(#shadow)"/>
  <text x="600" y="215" text-anchor="middle" class="label">django</text>
  <text x="600" y="247" text-anchor="middle" class="small">HTTP API + migrations</text>
  <text x="600" y="274" text-anchor="middle" class="small">starts product workflows</text>

  <rect x="900" y="155" width="230" height="125" rx="18" class="box" filter="url(#shadow)"/>
  <text x="1015" y="202" text-anchor="middle" class="label">postgres</text>
  <text x="1015" y="233" text-anchor="middle" class="small">products + workflow state</text>
  <text x="1015" y="258" text-anchor="middle" class="small">internal host name</text>

  <rect x="425" y="475" width="350" height="150" rx="18" class="accent" filter="url(#shadow)"/>
  <text x="600" y="525" text-anchor="middle" class="label">temporal-worker</text>
  <text x="600" y="557" text-anchor="middle" class="small">runs workflow activities</text>
  <text x="600" y="584" text-anchor="middle" class="small">task queue: product-tasks</text>

  <rect x="880" y="390" width="250" height="120" rx="18" class="box" filter="url(#shadow)"/>
  <text x="1005" y="435" text-anchor="middle" class="label">temporal</text>
  <text x="1005" y="466" text-anchor="middle" class="small">workflow history</text>
  <text x="1005" y="491" text-anchor="middle" class="small">localhost:7233</text>

  <rect x="70" y="500" width="250" height="110" rx="18" class="box" filter="url(#shadow)"/>
  <text x="195" y="545" text-anchor="middle" class="label">temporal-ui</text>
  <text x="195" y="576" text-anchor="middle" class="small">inspect executions</text>
  <text x="195" y="599" text-anchor="middle" class="small">localhost:8088</text>

  <rect x="850" y="605" width="280" height="85" rx="18" class="box"/>
  <text x="990" y="640" text-anchor="middle" class="label">mailpit</text>
  <text x="990" y="667" text-anchor="middle" class="small">development email inbox</text>

  <path d="M320 240H435" class="line"/>
  <path d="M765 225H890" class="line"/>
  <path d="M600 325V465" class="line"/>
  <path d="M775 550H870L930 500" class="line"/>
  <path d="M880 450L775 510" class="line"/>
  <path d="M425 550H330" class="dashed"/>
  <path d="M760 285L940 605" class="dashed"/>

  <text x="78" y="710" class="small">Solid lines: application communication</text>
  <text x="410" y="710" class="small">Dashed lines: observability or development support</text>
</svg>
