<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Product onboarding workflow</title>
  <desc id="desc">A sequential diagram showing product creation, pricing suggestion, human approval or timeout, price update, publish retries, and compensation on failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#f5eee3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#3c2919" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a25e2d"/>
    </marker>
    <marker id="branch" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8d4d4d"/>
    </marker>
    <style>
      .title { font: 700 31px Georgia, serif; fill: #3c2919; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #806a54; }
      .label { font: 700 19px system-ui, sans-serif; fill: #3c2919; }
      .small { font: 400 14px system-ui, sans-serif; fill: #806a54; }
      .box { fill: #ffffff; stroke: #d8b996; stroke-width: 2; }
      .main { fill: #fff0d9; stroke: #c8864d; stroke-width: 2; }
      .success { fill: #e7f2e8; stroke: #6d9c71; stroke-width: 2; }
      .failure { fill: #f8e5e2; stroke: #bb6860; stroke-width: 2; }
      .line { stroke: #a25e2d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .branch-line { stroke: #8d4d4d; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#branch); }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Product onboarding is a durable conversation</text>
  <text x="70" y="102" class="subtitle">The request starts the workflow; Temporal coordinates the work that may take minutes or hours.</text>

  <rect x="70" y="180" width="205" height="105" rx="17" class="box" filter="url(#shadow)"/>
  <text x="172" y="222" text-anchor="middle" class="label">1. Create</text>
  <text x="172" y="252" text-anchor="middle" class="small">status: pending_pricing</text>

  <rect x="330" y="180" width="220" height="105" rx="17" class="main" filter="url(#shadow)"/>
  <text x="440" y="222" text-anchor="middle" class="label">2. Suggest price</text>
  <text x="440" y="252" text-anchor="middle" class="small">Hugging Face or fallback</text>

  <rect x="605" y="180" width="245" height="105" rx="17" class="main" filter="url(#shadow)"/>
  <text x="727" y="222" text-anchor="middle" class="label">3. Approve or wait</text>
  <text x="727" y="252" text-anchor="middle" class="small">signal or 24-hour timeout</text>

  <rect x="905" y="180" width="225" height="105" rx="17" class="main" filter="url(#shadow)"/>
  <text x="1017" y="222" text-anchor="middle" class="label">4. Update price</text>
  <text x="1017" y="252" text-anchor="middle" class="small">save final price</text>

  <path d="M275 232H320" class="line"/>
  <path d="M550 232H595" class="line"/>
  <path d="M850 232H895" class="line"/>

  <rect x="350" y="430" width="245" height="105" rx="17" class="main" filter="url(#shadow)"/>
  <text x="472" y="472" text-anchor="middle" class="label">5. Publish</text>
  <text x="472" y="502" text-anchor="middle" class="small">up to 3 attempts</text>

  <rect x="680" y="430" width="220" height="105" rx="17" class="success" filter="url(#shadow)"/>
  <text x="790" y="472" text-anchor="middle" class="label">Published</text>
  <text x="790" y="502" text-anchor="middle" class="small">status: active</text>

  <rect x="920" y="590" width="210" height="100" rx="17" class="failure" filter="url(#shadow)"/>
  <text x="1025" y="630" text-anchor="middle" class="label">Compensate</text>
  <text x="1025" y="660" text-anchor="middle" class="small">status: failed_publish</text>

  <path d="M1017 285V360H472V420" class="line"/>
  <path d="M595 482H670" class="line"/>
  <path d="M595 505H790V420" class="line"/>
  <path d="M595 535H850L970 585" class="branch-line"/>

  <text x="80" y="650" class="small">Query: read the suggestion without changing state</text>
  <text x="80" y="678" class="small">Signal: approve or override the selected price</text>
  <text x="80" y="706" class="small">Retry: transient publish errors are retried before compensation</text>
</svg>
